<!doctype html><html lang="en" data-theme="light"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Financial Intelligence Dashboard</title>
<style>
:root{--bg:#F4F5F7;--cd:#fff;--tx:#202124;--mu:#6b7280;--ln:#e5e7eb;--rd:#D6002A}
[data-theme=dark]{--bg:#15181d;--cd:#1e2229;--tx:#e8eaed;--mu:#9aa3b0;--ln:#323945}
*{box-sizing:border-box}body{margin:0;font:14px/1.45 system-ui,Segoe UI,Arial,sans-serif;background:var(--bg);color:var(--tx)}
.app{display:flex;min-height:100vh}aside{width:230px;background:var(--cd);border-right:1px solid var(--ln);padding:16px;flex:none}
.logo{font-weight:800;font-size:17px;color:var(--rd);margin-bottom:2px}.sub{color:var(--mu);font-size:11px;margin-bottom:16px}
.nav{display:block;width:100%;text-align:left;border:0;background:none;color:var(--tx);padding:9px 10px;border-radius:8px;cursor:pointer;font:inherit;margin-bottom:2px}
.nav.on{background:var(--rd);color:#fff}.nav:hover:not(.on){background:var(--bg)}
main{flex:1;padding:18px;min-width:0}.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:12px}
select,button,input{font:inherit;color:var(--tx);background:var(--cd);border:1px solid var(--ln);border-radius:8px;padding:6px 9px}button{cursor:pointer}
.pri{background:var(--rd);color:#fff;border-color:var(--rd)}.chip{background:var(--rd);color:#fff;border-radius:99px;padding:2px 10px;font-size:12px}
h1{margin:0 0 2px;font-size:22px}.pu{color:var(--mu);margin:0 0 14px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px;margin-bottom:12px}
.card{background:var(--cd);border:1px solid var(--ln);border-radius:12px;padding:12px;box-shadow:0 1px 3px rgba(0,0,0,.06)}
.kpi{cursor:pointer}.kpi small{color:var(--mu)}.kpi b{display:block;font-size:22px}.tag{font-size:10px;color:var(--mu);border:1px solid var(--ln);border-radius:4px;padding:0 4px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(380px,1fr));gap:12px}.card h3{margin:0 0 6px;font-size:13px}
.ch{height:310px}.empty{height:200px;display:flex;align-items:center;justify-content:center;color:var(--mu)}
table{border-collapse:collapse;width:100%;font-size:12px}th,td{padding:5px 8px;border-bottom:1px solid var(--ln);text-align:left}.sc{overflow-x:auto}
.drop{border:2px dashed var(--rd);border-radius:12px;padding:30px;text-align:center;margin-bottom:12px}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.5);display:flex;align-items:center;justify-content:center;z-index:9}.ov>div{max-width:440px}
.hi{color:var(--rd);font-weight:700}.err{background:#fde8ec;color:#8a0019;padding:10px;border-radius:8px;margin-bottom:10px}
@media(max-width:800px){.app{flex-direction:column}aside{width:auto}.grid{grid-template-columns:1fr}}
@media print{aside,.noprint{display:none!important}body{background:#fff}}
</style>
